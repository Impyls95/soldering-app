<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t d">
  <title id="t">Делитель напряжения</title>
  <desc id="d">Два резистора последовательно: 12 вольт поступает на R1 10 килоом и R2 3,3 килоома. Выход между ними даёт около 3 вольт.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e3e8f0" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', Arial, sans-serif; fill: #172033; }
      .m { font-family: 'Segoe UI', Arial, sans-serif; fill: #5a6678; }
      .tag { font-family: Consolas, 'Courier New', monospace; fill: #b45309; letter-spacing: 2px; }
      .f { font-family: Consolas, 'Courier New', monospace; fill: #172033; font-weight: 700; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; fill: #172033; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="750" fill="#f4f6fa"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity=".7"/>
  <rect x="60" y="48" width="150" height="38" rx="19" fill="#e8f0ff" stroke="#93b4f5"/>
  <text class="tag" x="82" y="74" font-size="19">СХЕМА</text>
  <text class="t" x="60" y="145" font-size="44" font-weight="700">Делитель напряжения</text>
  <text class="m" x="60" y="184" font-size="24">Два резистора делят входное напряжение в заданной пропорции.</text>

  <!-- circuit -->
  <rect x="60" y="210" width="600" height="470" rx="22" fill="#ffffff" stroke="#e1e7f0" stroke-width="2"/>
  <text x="90" y="252" class="lbl" font-size="26">12 В → около 3 В</text>

  <circle cx="180" cy="300" r="19" fill="#fff1e6" stroke="#b45309" stroke-width="3"/>
  <text x="180" y="306" text-anchor="middle" class="lbl" font-size="15" fill="#b45309">12 В</text>
  <path d="M199 300h101M300 300v30" stroke="#172033" stroke-width="4"/>
  <rect x="278" y="330" width="44" height="80" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
  <text x="340" y="365" class="lbl" font-size="22">R1</text>
  <text x="340" y="392" class="m" font-size="19">10 кОм</text>
  <path d="M300 410v40" stroke="#172033" stroke-width="4"/>

  <circle cx="300" cy="450" r="6" fill="#172033"/>
  <path d="M300 450h150" stroke="#172033" stroke-width="4"/>
  <circle cx="460" cy="450" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <text x="480" y="443" class="lbl" font-size="21" fill="#2563eb">Uвых</text>
  <text x="480" y="470" class="m" font-size="18">≈ 3 В</text>

  <path d="M300 450v30" stroke="#172033" stroke-width="4"/>
  <rect x="278" y="480" width="44" height="80" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
  <text x="340" y="515" class="lbl" font-size="22">R2</text>
  <text x="340" y="542" class="m" font-size="19">3,3 кОм</text>
  <path d="M300 560v45" stroke="#172033" stroke-width="4"/>
  <path d="M270 605h60M280 621h40M292 637h16" stroke="#172033" stroke-width="4" stroke-linecap="round"/>

  <text x="90" y="655" class="m" font-size="17">Ток через оба резистора одинаковый.</text>

  <!-- formula -->
  <rect x="690" y="210" width="450" height="470" rx="22" fill="#fff7ed" stroke="#f0b27a" stroke-width="2"/>
  <text x="720" y="252" class="m" font-size="19" letter-spacing="1">ФОРМУЛА</text>
  <text x="720" y="300" class="f" font-size="25">Uвых = Uвх × R2 / (R1 + R2)</text>
  <path d="M720 322h390" stroke="#f0b27a" stroke-width="2"/>

  <text x="720" y="368" class="m" font-size="19">12 В × 3,3 кОм</text>
  <text x="720" y="398" class="m" font-size="19">──────────────── = 2,98 В</text>
  <text x="720" y="428" class="m" font-size="19">10 кОм + 3,3 кОм</text>

  <rect x="720" y="460" width="390" height="110" rx="14" fill="#ffffff" stroke="#f0b27a"/>
  <text x="742" y="496" class="lbl" font-size="20">Важно</text>
  <text x="742" y="526" class="m" font-size="18">Делитель — для сигнала или опоры.</text>
  <text x="742" y="554" class="m" font-size="18">Для питания нагрузки он не подходит.</text>

  <text x="720" y="620" class="m" font-size="17">Ток делителя: 12 В / 13,3 кОм ≈ 0,9 мА</text>
</svg>
