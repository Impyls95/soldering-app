  <g stroke="#6b7280" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="470" y="250" width="260" height="180" rx="14"/>
    <circle cx="535" cy="310" r="22"/>
    <path d="M470 405l80-80 55 55 35-35 90 60"/>
  </g>
  <text x="600" y="505" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="700" fill="#374151">Изображение недоступно</text>
  <text x="600" y="552" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#4b5563">Файл не найден. Замените его в папке images/ —</text>
  <text x="600" y="586" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#4b5563">код и конфигурацию менять не нужно.</text>
