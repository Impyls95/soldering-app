<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t d">
  <title id="t">Изображение недоступно</title>
  <desc id="d">Серая заглушка: файл картинки не найден. Замените его в папке images, не меняя код.</desc>
  <rect width="1200" height="750" fill="#d7dce3"/>
