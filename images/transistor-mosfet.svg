<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t d">
  <title id="t">Полевой транзистор N-канальный MOSFET</title>
  <desc id="d">Слева обозначение MOSFET с выводами затвор, сток и исток. Справа схема низкого ключа: нагрузка в цепи стока, затвор через резистор подключён к входу и прижат к земле резистором 10 кОм.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e3e8f0" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', Arial, sans-serif; fill: #172033; }
      .m { font-family: 'Segoe UI', Arial, sans-serif; fill: #5a6678; }
      .tag { font-family: Consolas, 'Courier New', monospace; fill: #b45309; letter-spacing: 2px; }
      .f { font-family: Consolas, 'Courier New', monospace; fill: #172033; font-weight: 700; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; fill: #172033; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="750" fill="#f4f6fa"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity=".7"/>
  <rect x="60" y="48" width="170" height="38" rx="19" fill="#e8f0ff" stroke="#93b4f5"/>
  <text class="tag" x="82" y="74" font-size="19">ТРАНЗИСТОР</text>
  <text class="t" x="60" y="145" font-size="44" font-weight="700">Полевой транзистор N-MOSFET</text>
  <text class="m" x="60" y="184" font-size="24">Напряжение на затворе открывает канал между стоком и истоком.</text>

  <!-- symbol -->
  <rect x="60" y="210" width="470" height="470" rx="22" fill="#ffffff" stroke="#e1e7f0" stroke-width="2"/>
  <text x="90" y="252" class="lbl" font-size="26">Обозначение и выводы</text>
  <circle cx="290" cy="420" r="135" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <path d="M240 330v180" stroke="#172033" stroke-width="7" stroke-linecap="round"/>
  <path d="M270 330v35M270 385v70M270 475v35" stroke="#172033" stroke-width="9" stroke-linecap="round"/>
  <path d="M120 420h120" stroke="#172033" stroke-width="5"/>
  <path d="M270 345h80v-60" stroke="#172033" stroke-width="5" fill="none"/>
  <path d="M270 495h80v60" stroke="#172033" stroke-width="5" fill="none"/>
  <path d="M270 420l-24-12v24z" fill="#172033"/>
  <circle cx="350" cy="285" r="6" fill="#172033"/>
  <circle cx="350" cy="555" r="6" fill="#172033"/>
  <text x="126" y="400" class="lbl" font-size="26">З</text>
  <text x="108" y="445" class="m" font-size="18">затвор</text>
  <text x="365" y="282" class="lbl" font-size="26">С</text>
  <text x="375" y="320" class="m" font-size="18">сток</text>
  <text x="365" y="565" class="lbl" font-size="26">И</text>
  <text x="375" y="600" class="m" font-size="18">исток</text>
  <text x="90" y="656" class="m" font-size="18">Затвор изолирован — постоянный ток через него не течёт.</text>

  <!-- circuit -->
  <rect x="570" y="210" width="570" height="470" rx="22" fill="#ffffff" stroke="#e1e7f0" stroke-width="2"/>
  <text x="600" y="252" class="lbl" font-size="26">Схема низкого ключа</text>

  <path d="M680 300h360" stroke="#172033" stroke-width="4"/>
  <text x="700" y="288" class="m" font-size="19">+9 В</text>
  <rect x="900" y="318" width="40" height="70" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
  <text x="960" y="352" class="lbl" font-size="21">Rн 470 Ω</text>
  <text x="960" y="378" class="m" font-size="18">нагрузка</text>
  <path d="M920 300v18M920 388v52" stroke="#172033" stroke-width="4"/>

  <path d="M835 445v110" stroke="#172033" stroke-width="6" stroke-linecap="round"/>
  <path d="M865 455v20M865 485v30M865 525v20" stroke="#172033" stroke-width="8" stroke-linecap="round"/>
  <path d="M740 500h95" stroke="#172033" stroke-width="4"/>
  <path d="M865 465h55v-25" stroke="#172033" stroke-width="4" fill="none"/>
  <path d="M865 535h55v85" stroke="#172033" stroke-width="4" fill="none"/>
  <path d="M865 500l-18-10v20z" fill="#172033"/>

  <rect x="660" y="481" width="60" height="38" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
  <text x="690" y="506" text-anchor="middle" class="lbl" font-size="14">100 Ω</text>
  <circle cx="625" cy="500" r="18" fill="#e8f0ff" stroke="#2563eb" stroke-width="3"/>
  <text x="625" y="506" text-anchor="middle" class="lbl" font-size="15" fill="#1d4ed8">3 В</text>
  <path d="M643 500h17M720 500h115" stroke="#172033" stroke-width="4"/>

  <path d="M800 500v20M800 580v40" stroke="#172033" stroke-width="4"/>
  <circle cx="800" cy="500" r="5" fill="#172033"/>
  <rect x="780" y="520" width="40" height="60" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
  <text x="800" y="556" text-anchor="middle" class="lbl" font-size="16">10 к</text>
  <path d="M770 620h60M785 636h30M798 652h4" stroke="#172033" stroke-width="4" stroke-linecap="round"/>

  <path d="M880 620h80M895 636h50M908 652h24" stroke="#172033" stroke-width="4" stroke-linecap="round"/>

  <text x="790" y="482" text-anchor="middle" class="lbl" font-size="19">З</text>
  <text x="940" y="455" class="lbl" font-size="19">С</text>
  <text x="940" y="590" class="lbl" font-size="19">И</text>

  <text x="600" y="665" class="m" font-size="18">Затвор не должен «висеть в воздухе»: 10 кОм прижимают его к земле.</text>
</svg>
