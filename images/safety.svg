<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t d">
  <title id="t">Правила безопасности при пайке</title>
  <desc id="d">Четыре карточки: ожог, дым от флюса, свинец на руках и защита глаз.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e3e8f0" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', Arial, sans-serif; fill: #172033; }
      .m { font-family: 'Segoe UI', Arial, sans-serif; fill: #5a6678; }
      .tag { font-family: Consolas, 'Courier New', monospace; fill: #b45309; letter-spacing: 2px; }
    </style>
  </defs>
  <rect width="1200" height="750" fill="#f4f6fa"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity=".7"/>
  <rect x="60" y="48" width="210" height="38" rx="19" fill="#fff1e6" stroke="#f0b27a"/>
  <text class="tag" x="82" y="74" font-size="19">БЕЗОПАСНОСТЬ</text>
  <text class="t" x="60" y="145" font-size="44" font-weight="700">Четыре правила, которые нельзя нарушать</text>
  <text class="m" x="60" y="184" font-size="24">Пайка — это 300+ градусов, дым и свинец. Простые привычки берегут здоровье.</text>

  <g>
    <rect x="60" y="220" width="525" height="225" rx="24" fill="#ffffff" stroke="#e1e7f0" stroke-width="2"/>
    <circle cx="130" cy="290" r="42" fill="#fff1e6" stroke="#f0b27a" stroke-width="2"/>
    <g stroke="#c2410c" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M105 307l38-38"/>
      <path d="M134 260l12-12 18 18-12 12z" fill="#c2410c" stroke="none"/>
      <path d="M150 246c8-8 18-8 26 0"/>
      <path d="M100 312h30"/>
    </g>
    <text class="t" x="195" y="278" font-size="30" font-weight="700">Ожог</text>
    <text class="m" x="195" y="312" font-size="22">Жало нагрето до 300–350 °C.</text>
    <text class="m" x="195" y="344" font-size="22">Держи за рукоятку, клади</text>
    <text class="m" x="195" y="376" font-size="22">только на подставку.</text>
  </g>

  <g>
    <rect x="615" y="220" width="525" height="225" rx="24" fill="#ffffff" stroke="#e1e7f0" stroke-width="2"/>
    <circle cx="685" cy="290" r="42" fill="#e8f7f4" stroke="#7dd3c7" stroke-width="2"/>
    <g stroke="#0f766e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="685" cy="290" r="13"/>
      <path d="M685 277c20-8 28 10 14 18-10 6-18-6-14-18zM698 290c8 20-10 28-18 14-6-10 6-18 18-14zM672 290c-8-20 10-28 18-14 6 10-6 18-18 14z"/>
      <path d="M672 303c-20 8-28-10-14-18 10-6 18 6 14 18z"/>
      <path d="M710 254c8-8 18-8 26 0" stroke="#f59e0b"/>
      <path d="M736 250l4-14 10 12" stroke="#f59e0b"/>
    </g>
    <text class="t" x="750" y="278" font-size="30" font-weight="700">Дым</text>
    <text class="m" x="750" y="312" font-size="22">Флюс дымит при нагреве.</text>
    <text class="m" x="750" y="344" font-size="22">Включи вытяжку или открой</text>
    <text class="m" x="750" y="376" font-size="22">окно, не наклоняйся над платой.</text>
  </g>

  <g>
    <rect x="60" y="470" width="525" height="225" rx="24" fill="#ffffff" stroke="#e1e7f0" stroke-width="2"/>
    <circle cx="130" cy="540" r="42" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
    <g stroke="#4338ca" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M130 512c14 16 22 27 22 37a22 22 0 1 1-44 0c0-10 8-21 22-37z"/>
      <path d="M112 560h36"/>
    </g>
    <text class="t" x="195" y="528" font-size="30" font-weight="700">Свинец</text>
    <text class="m" x="195" y="562" font-size="22">В припое может быть свинец.</text>
    <text class="m" x="195" y="594" font-size="22">Мой руки с мылом после работы,</text>
    <text class="m" x="195" y="626" font-size="22">не ешь и не пей за столом.</text>
  </g>

  <g>
    <rect x="615" y="470" width="525" height="225" rx="24" fill="#ffffff" stroke="#e1e7f0" stroke-width="2"/>
    <circle cx="685" cy="540" r="42" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <g stroke="#6d28d9" stroke-width="5" fill="none" stroke-linecap="round">
      <circle cx="668" cy="540" r="16"/>
      <circle cx="702" cy="540" r="16"/>
      <path d="M684 540h2M652 534l-10-8M718 534l10-8"/>
    </g>
    <text class="t" x="750" y="528" font-size="30" font-weight="700">Глаза</text>
    <text class="m" x="750" y="562" font-size="22">Надень очки, когда кусаешь</text>
    <text class="m" x="750" y="594" font-size="22">выводы: обрезки отлетают</text>
    <text class="m" x="750" y="626" font-size="22">с большой скоростью.</text>
  </g>

  <g>
    <rect x="60" y="716" width="1080" height="0" fill="none"/>
    <text class="m" x="60" y="736" font-size="20">Главное: не оставляй включённый паяльник без присмотра и выключай его, если отходишь.</text>
  </g>
</svg>
