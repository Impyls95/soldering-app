<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t d">
  <title id="t">Конденсатор: заряд и разряд</title>
  <desc id="d">Конденсатор запасает заряд на двух обкладках. График показывает быстрый заряд и разряд через резистор; за одну постоянную времени R умножить на C напряжение достигает 63 процентов.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e3e8f0" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: 'Segoe UI', Arial, sans-serif; fill: #172033; }
      .m { font-family: 'Segoe UI', Arial, sans-serif; fill: #5a6678; }
      .tag { font-family: Consolas, 'Courier New', monospace; fill: #b45309; letter-spacing: 2px; }
      .f { font-family: Consolas, 'Courier New', monospace; fill: #172033; font-weight: 700; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; fill: #172033; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="750" fill="#f4f6fa"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity=".7"/>
  <rect x="60" y="48" width="160" height="38" rx="19" fill="#e8f0ff" stroke="#93b4f5"/>
  <text class="tag" x="82" y="74" font-size="19">КОМПОНЕНТ</text>
  <text class="t" x="60" y="145" font-size="44" font-weight="700">Конденсатор: банк заряда</text>
  <text class="m" x="60" y="184" font-size="24">Запасает энергию, сглаживает пульсации и задаёт время.</text>

  <!-- symbol panel -->
  <rect x="60" y="210" width="440" height="430" rx="22" fill="#ffffff" stroke="#e1e7f0" stroke-width="2"/>
  <text x="90" y="252" class="lbl" font-size="27">Обозначение</text>
  <path d="M115 340h105M260 340h105" stroke="#172033" stroke-width="4"/>
  <path d="M220 275v130M260 275v130" stroke="#172033" stroke-width="7" stroke-linecap="round"/>
  <text x="202" y="316" text-anchor="middle" class="lbl" font-size="24" fill="#b45309">+</text>
  <text x="278" y="316" text-anchor="middle" class="lbl" font-size="24" fill="#475569">−</text>
  <text x="150" y="382" class="m" font-size="19">вывод</text>
  <text x="300" y="382" class="m" font-size="19">вывод</text>
  <text x="240" y="430" text-anchor="middle" class="m" font-size="19">две обкладки и диэлектрик</text>

  <rect x="90" y="470" width="380" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="108" y="506" class="f" font-size="26">Q = C × U</text>
  <rect x="90" y="538" width="380" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="108" y="574" class="f" font-size="26">τ = R × C</text>
  <text x="90" y="618" class="m" font-size="17">C — фарады (Ф), R — омы, τ — секунды</text>

  <!-- graph -->
  <rect x="540" y="210" width="600" height="430" rx="22" fill="#ffffff" stroke="#e1e7f0" stroke-width="2"/>
  <text x="570" y="252" class="lbl" font-size="27">Заряд и разряд через резистор</text>

  <path d="M600 560V275M600 560h480" stroke="#475569" stroke-width="3" fill="none"/>
  <path d="M1080 560l-15-8v16z" fill="#475569"/>
  <text x="560" y="300" text-anchor="end" class="m" font-size="20">U</text>
  <text x="1085" y="590" text-anchor="end" class="m" font-size="20">t</text>
  <path d="M600 290h480" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <path d="M600 560C660 560 690 380 760 320S980 292 1080 290" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <path d="M600 290C660 290 690 470 760 530S980 558 1080 560" fill="none" stroke="#d97706" stroke-width="4" stroke-dasharray="10 7" stroke-linecap="round"/>

  <text x="820" y="320" class="lbl" font-size="22" fill="#2563eb">заряд</text>
  <text x="820" y="540" class="lbl" font-size="22" fill="#b45309">разряд</text>

  <path d="M690 560V380H600" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
  <text x="700" y="372" class="m" font-size="19">63% за время τ</text>
  <text x="700" y="596" class="m" font-size="19">1τ</text>

  <text x="570" y="630" class="m" font-size="18">За 1τ конденсатор заряжается на 63%, за 5τ — почти полностью.</text>
</svg>
