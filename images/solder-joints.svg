<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t d">
  <title id="t">Хорошая, холодная пайка и перемычка</title>
  <desc id="d">Три разреза паяного соединения: хорошая пайка с гладким вогнутым швом, холодная пайка с матовым шариком и перемычка, соединившая соседние площадки.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e3e8f0" stroke-width="1"/>
    </pattern>
    <linearGradient id="solder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".45" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="dull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', Arial, sans-serif; fill: #172033; }
      .m { font-family: 'Segoe UI', Arial, sans-serif; fill: #5a6678; }
      .tag { font-family: Consolas, 'Courier New', monospace; fill: #b45309; letter-spacing: 2px; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; fill: #172033; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="750" fill="#f4f6fa"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity=".7"/>
  <rect x="60" y="48" width="170" height="38" rx="19" fill="#e8f0ff" stroke="#93b4f5"/>
  <text class="tag" x="82" y="74" font-size="19">КАЧЕСТВО</text>
  <text class="t" x="60" y="145" font-size="44" font-weight="700">Как выглядит пайка</text>
  <text class="m" x="60" y="184" font-size="24">Разрез одного и того же места: площадка, вывод, припой.</text>

  <!-- good -->
  <g>
    <rect x="60" y="210" width="350" height="470" rx="22" fill="#ffffff" stroke="#bbf7d0" stroke-width="3"/>
    <circle cx="100" cy="256" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M90 256l7 8 14-16" stroke="#15803d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="132" y="266" class="lbl" font-size="26" fill="#15803d">Хорошая</text>
    <text x="90" y="288" class="m" font-size="17">гладкий вогнутый шов</text>

    <g transform="translate(0 22)">
      <rect x="90" y="350" width="290" height="80" rx="6" fill="#166534"/>
      <rect x="90" y="344" width="290" height="12" rx="4" fill="#22c55e"/>
      <rect x="130" y="336" width="80" height="14" rx="3" fill="#f59e0b"/>
      <rect x="260" y="336" width="80" height="14" rx="3" fill="#f59e0b"/>
      <rect x="172" y="280" width="20" height="130" rx="3" fill="#94a3b8"/>
      <path d="M150 338c0-24 10-36 32-36s32 12 32 36c0 14-14 18-32 18s-32-4-32-18z" fill="url(#solder)" stroke="#64748b" stroke-width="2"/>
      <path d="M160 334c4-14 12-20 22-20" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/>
    </g>
    <text x="90" y="480" class="lbl" font-size="19">Что видно</text>
    <text x="90" y="512" class="m" font-size="18">Припой блестит, тянется</text>
    <text x="90" y="540" class="m" font-size="18">к выводу воронкой.</text>
    <text x="90" y="586" class="lbl" font-size="19" fill="#15803d">Вывод: годится</text>
  </g>

  <!-- cold -->
  <g>
    <rect x="430" y="210" width="350" height="470" rx="22" fill="#ffffff" stroke="#fecaca" stroke-width="3"/>
    <circle cx="470" cy="256" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <path d="M462 248l16 16M478 248l-16 16" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/>
    <text x="502" y="266" class="lbl" font-size="26" fill="#b91c1c">Холодная</text>
    <text x="460" y="288" class="m" font-size="17">матовый шарик, плохой контакт</text>

    <g transform="translate(0 22)">
      <rect x="460" y="350" width="290" height="80" rx="6" fill="#166534"/>
      <rect x="460" y="344" width="290" height="12" rx="4" fill="#22c55e"/>
      <rect x="500" y="336" width="80" height="14" rx="3" fill="#f59e0b"/>
      <rect x="630" y="336" width="80" height="14" rx="3" fill="#f59e0b"/>
      <rect x="542" y="280" width="20" height="130" rx="3" fill="#94a3b8"/>
      <circle cx="552" cy="324" r="35" fill="url(#dull)" stroke="#475569" stroke-width="2"/>
      <path d="M530 314l10 6-6 9 12 3M548 344l8-7 6 9 10-3" stroke="#475569" stroke-width="2" fill="none"/>
    </g>
    <text x="460" y="480" class="lbl" font-size="19">Что видно</text>
    <text x="460" y="512" class="m" font-size="18">Шарик серый, бугристый,</text>
    <text x="460" y="540" class="m" font-size="18">вывод качается.</text>
    <text x="460" y="586" class="lbl" font-size="19" fill="#b91c1c">Вывод: переделать</text>
  </g>

  <!-- bridge -->
  <g>
    <rect x="800" y="210" width="340" height="470" rx="22" fill="#ffffff" stroke="#fde68a" stroke-width="3"/>
    <circle cx="840" cy="256" r="20" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <path d="M832 248l16 16M848 248l-16 16" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <text x="872" y="266" class="lbl" font-size="26" fill="#b45309">Перемычка</text>
    <text x="830" y="288" class="m" font-size="17">припой соединил соседние пятна</text>

    <g transform="translate(0 22)">
      <rect x="830" y="350" width="290" height="80" rx="6" fill="#166534"/>
      <rect x="830" y="344" width="290" height="12" rx="4" fill="#22c55e"/>
      <rect x="856" y="336" width="70" height="14" rx="3" fill="#f59e0b"/>
      <rect x="1006" y="336" width="70" height="14" rx="3" fill="#f59e0b"/>
      <rect x="888" y="280" width="18" height="130" rx="3" fill="#94a3b8"/>
      <rect x="1036" y="280" width="18" height="130" rx="3" fill="#94a3b8"/>
      <path d="M870 336c0-20 20-28 45-28h60c25 0 45 8 45 28 0 16-26 24-75 24s-75-8-75-24z" fill="url(#solder)" stroke="#64748b" stroke-width="2"/>
      <path d="M920 326h70" stroke="#94a3b8" stroke-width="4"/>
    </g>
    <text x="830" y="480" class="lbl" font-size="19">Что видно</text>
    <text x="830" y="512" class="m" font-size="18">Припой перекрыл зазор</text>
    <text x="830" y="540" class="m" font-size="18">между двумя контактами.</text>
    <text x="830" y="586" class="lbl" font-size="19" fill="#b45309">Вывод: убрать оплёткой</text>
  </g>

  <text x="60" y="718" class="m" font-size="19">Правило: греть площадку и вывод, а не сам припой. Блестящая воронка — хороший признак.</text>
</svg>
