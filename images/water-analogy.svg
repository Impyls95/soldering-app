<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t d">
  <title id="t">Аналогия электричества с водой</title>
  <desc id="d">Бак с водой создаёт давление, труба пропускает поток, узкое место ограничивает его. Давление — это напряжение, поток — ток, узкое место — сопротивление.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e3e8f0" stroke-width="1"/>
    </pattern>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2563eb"/>
    </marker>
    <style>
      .t { font-family: 'Segoe UI', Arial, sans-serif; fill: #172033; }
      .m { font-family: 'Segoe UI', Arial, sans-serif; fill: #5a6678; }
      .tag { font-family: Consolas, 'Courier New', monospace; fill: #b45309; letter-spacing: 2px; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; fill: #1e3a8a; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="750" fill="#f4f6fa"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity=".7"/>
  <rect x="60" y="48" width="150" height="38" rx="19" fill="#e8f0ff" stroke="#93b4f5"/>
  <text class="tag" x="82" y="74" font-size="19">ОСНОВЫ</text>
  <text class="t" x="60" y="145" font-size="44" font-weight="700">Электричество — это вода в трубах</text>
  <text class="m" x="60" y="184" font-size="24">Три величины, которые нужно различать с самого начала.</text>

  <!-- tank -->
  <text class="lbl" x="78" y="245" font-size="27">Источник</text>
  <rect x="78" y="262" width="240" height="300" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="4"/>
  <rect x="90" y="330" width="216" height="220" rx="8" fill="url(#water)"/>
  <path d="M90 348c30-10 60 10 90 0s60 10 90 0 36 6 36 6v-24H90z" fill="#93c5fd" opacity=".85"/>
  <text x="198" y="420" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="54" font-weight="700" fill="#ffffff">9 В</text>
  <text x="198" y="460" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="22" fill="#dbeafe">давление</text>

  <!-- gauge -->
  <circle cx="318" cy="300" r="38" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <path d="M318 300l18-16" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <text x="318" y="356" text-anchor="middle" class="lbl" font-size="26">U</text>

  <!-- pipe -->
  <path d="M318 500h422" stroke="#94a3b8" stroke-width="48" stroke-linecap="round" fill="none"/>
  <path d="M318 500h422" stroke="#dbeafe" stroke-width="30" stroke-linecap="round" fill="none"/>
  <path d="M330 500h400" stroke="url(#water)" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M748 500l-24-14v28z" fill="#2563eb"/>

  <!-- narrow section -->
  <rect x="560" y="484" width="120" height="32" rx="8" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
  <rect x="560" y="493" width="120" height="14" rx="5" fill="#fde68a"/>
  <path d="M620 536v20M560 556h120" stroke="#b45309" stroke-width="2" fill="none"/>
  <text x="620" y="588" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="28" font-weight="700" fill="#b45309">R — узкое место</text>

  <!-- labels -->
  <path d="M470 468v-26" stroke="#2563eb" stroke-width="2"/>
  <text x="470" y="428" text-anchor="middle" class="lbl" font-size="28">I — поток</text>
  <text x="470" y="456" text-anchor="middle" class="m" font-size="19">ток, амперы</text>

  <text x="78" y="620" class="m" font-size="24">Чем больше давление — тем сильнее поток.</text>
  <text x="78" y="654" class="m" font-size="24">Чем уже труба — тем слабее поток при том же давлении.</text>

  <g>
    <rect x="760" y="262" width="380" height="300" rx="20" fill="#ffffff" stroke="#e1e7f0" stroke-width="2"/>
    <text x="790" y="306" font-family="'Segoe UI', Arial" font-size="24" font-weight="700" fill="#172033">Запомнить</text>
    <text x="790" y="348" font-family="'Segoe UI', Arial" font-size="22" fill="#5a6678">U — напряжение, вольт (В)</text>
    <text x="790" y="386" font-family="'Segoe UI', Arial" font-size="22" fill="#5a6678">I — ток, ампер (А)</text>
    <text x="790" y="424" font-family="'Segoe UI', Arial" font-size="22" fill="#5a6678">R — сопротивление, ом (Ом)</text>
    <path d="M790 450h290" stroke="#e1e7f0" stroke-width="2"/>
    <text x="790" y="490" font-family="'Segoe UI', Arial" font-size="22" fill="#0f766e" font-weight="700">1 кОм = 1000 Ом</text>
    <text x="790" y="524" font-family="'Segoe UI', Arial" font-size="22" fill="#0f766e" font-weight="700">1 мА = 0,001 А</text>
  </g>
</svg>
